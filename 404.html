<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting to markprovan.com</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="canonical" href="https://markprovan.com/">
    <meta http-equiv="refresh" content="0; url=https://markprovan.com/">
    <script>
      // Any other path on this site goes to the same path on markprovan.com.
      if (location.hostname !== 'markprovan.com') {
        location.replace('https://markprovan.com' + location.pathname + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <p>This site has moved to <a href="https://markprovan.com/">markprovan.com</a>.</p>
  </body>
</html>
